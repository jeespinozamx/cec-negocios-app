<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/leaflet/dist/leaflet.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
</head>

<body>

    <div class="container-fluid">

        <div class="row">

            <div class="col-md-2 sidebar p-3">

                <h4>Directorio de negocios</h4>

                <hr>

                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('negocios') }}">Negocios</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('crear_negocio') }}">Crear Negocio</a>
                    </li>
                </ul>
            </div>

            <div class="col-md-10 p-4">

                {% block content %}{% endblock %}

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        const ctx = document.getElementById('chartTipos');

        new Chart(ctx,{
            type:'bar',
            data:{
                labels:[
                    'Papelerías',
                    'Panaderías',
                    'Abarrotes',
                    'Farmacias',
                    'Carnicerías'
                ],
                datasets:[{
                    label:'Cantidad',
                    data:[35,42,31,22,28]
                }]
            },
            options:{
                indexAxis:'y'
            }
        });

        const map = L.map('map').setView([19.5963,-98.93974],15);

        L.tileLayer(
        'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
        ).addTo(map);

        L.marker([19.59638,-98.9398])
        .addTo(map)
        .bindPopup('Panadería San Juan');

        L.marker([19.597253,-98.943465])
        .addTo(map)
        .bindPopup('Papelería López');

        L.marker([19.594438,-98.942912])
        .addTo(map)
        .bindPopup('Ferreteria El Mike');
    </script>

</body>

</html>
