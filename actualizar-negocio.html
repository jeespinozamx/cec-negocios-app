<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Actualizar Negocio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="css/styles.css" rel="stylesheet">

</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-3">

                <h4>Directorio de negocios</h4>

                <hr>

                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Dashboard</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="crear-negocio.html">Crear Negocio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="negocios.html">Negocios</a>
                    </li>
                </ul>

            </div>

            <div class="col-md-10 p-4">

                <h2 class="page-title">
                    Actualizar negocio
                </h2>

                <div class="card">

                    <div class="card-body">

                        <form>

                            <div class="row">
                                
                                <h4>Datos del negocio</h4>

                                <div class="col-md-12 mb-3">
                                    <label>Nombre</label>
                                    <input type="text" class="form-control" value="Panadería San Miguel">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Correo</label>
                                    <input type="text" class="form-control" placeholder="" value="panaderiasm@gmail.com">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Teléfono 1</label>
                                    <input type="text" class="form-control" placeholder="" value="5512345678">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Teléfono 2</label>
                                    <input type="text" class="form-control" placeholder="" value="5598765432">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Teléfono 3</label>
                                    <input type="text" class="form-control" placeholder="">
                                </div>

                                

                                

                                <div class="col-md-6 mb-3">
                                    <label>Rubro</label>
                                    <input type="text" class="form-control" placeholder="" value="Panaderia">
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label>Tipo negocio</label>
                                    <select class="form-select" aria-label="Default select example">
                                        <option selected value="">Seleccione uno</option>
                                        <option value="Fijo">Fijo</option>
                                        <option value="Semifijo">Semifijo</option>
                                    </select>
                                </div>
                                
                                <h4>Dias de funcionamiento</h4>

                                <div class="col-md-12 mb-3">
                                    
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="checkDefault" checked>
                                        <label class="form-check-label" for="checkDefault">
                                            Lunes
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="checkChecked" checked>
                                        <label class="form-check-label" for="checkChecked">
                                            Martes
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="checkChecked" checked>
                                        <label class="form-check-label" for="checkChecked">
                                            Miercoles
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="checkChecked" checked>
                                        <label class="form-check-label" for="checkChecked">
                                            Jueves
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="checkChecked" checked>
                                        <label class="form-check-label" for="checkChecked">
                                            Viernes
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="checkChecked">
                                        <label class="form-check-label" for="checkChecked">
                                            Sábado
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="checkChecked">
                                        <label class="form-check-label" for="checkChecked">
                                            Domingo
                                        </label>
                                    </div>
                                </div>

                                <h4>Ubicación</h4>

                                <div class="col-md-6 mb-3">
                                    <label>Latutud</label>
                                    <input type="text" class="form-control" placeholder="" value="19.59638">
                                </div>

                                <div class="col-6 mb-3">
                                    <label>Longitud</label>
                                    <input type="text" class="form-control" placeholder="" value="-98.9398">
                                </div>

                                <h4>Datos del propietario</h4>

                                <div class="col-md-6 mb-3">
                                    <label>Nombre</label>
                                    <input type="text" class="form-control" value="Juan">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label>Apellidos</label>
                                    <input type="text" class="form-control" value="Pérez">
                                </div>

                            </div>

                            <button class="btn btn-success">
                                Actualizar
                            </button>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
